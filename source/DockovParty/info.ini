description = 为《逃离鸭科夫》添加双人合作联机。直接继续游戏即成为服主，另一名玩家通过主菜单的“加入游戏”连接；场景切换、玩家状态、敌人、仓库与战利品均由服主协调和保存。所有网络配置均位于 ModSetting。 / Adds two-player cooperative multiplayer to Escape from Duckov. Continuing a save hosts the session, while the other player connects through Join Game. Scene transitions, players, enemies, storage, and loot are coordinated and persisted by the host. All network configuration lives in ModSetting. Source: https://github.com/SlimeNull/DuckovMods
