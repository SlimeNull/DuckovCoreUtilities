description = 为《逃离鸭科夫》提供本地 JSON RPC 互操作服务与场景检视器支持，可供场景检视器、MCP 及其他外部工具读取场景树，检查和修改游戏对象、组件、序列化字段及检视器属性。 / Provides a local JSON RPC interoperability service and Hierarchy Inspector support for Escape from Duckov, allowing the inspector, MCP, and other external tools to read the scene hierarchy and inspect or modify GameObjects, components, serialized fields, and Inspector-visible properties. Source: https://github.com/SlimeNull/DuckovMods
