description = 自定义角色死亡后的物品掉落与墓碑保留规则。可选择正常掉落、仅掉落背包内品质 0-2 的物品、仅掉落背包内物品、完全不掉落或全部掉落；全部掉落包含原版保护的图腾与近战武器，完全不掉落时不会生成墓碑。墓碑可不保留，或保留一个、两个、三个及全部尚未拾取的记录。支持 DuckovModSettings 游戏内配置。 / Customizes item loss and tomb retention after player death. Choose normal drops, quality 0-2 backpack items only, backpack items only, no drops, or all drops. All drops includes protected equipment such as the totem and melee weapon; no-drop deaths do not create tombs. Tombs can be discarded or retain one, two, three, or every untouched record. Configurable through DuckovModSettings. Source: https://github.com/SlimeNull/DuckovMods
